name: spotify-history

services:
  spotify-db:
    image: postgres:16-alpine
    container_name: spotify-history-postgres
    environment:
      POSTGRES_DB: spotify_history
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: ${SPOTIFY_DB_PASSWORD:?Ejecuta el script de arranque primero}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - spotify_history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify -d spotify_history"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - spotify_history

  dashboard:
    build: ./dashboard
    container_name: spotify-history-dashboard
    environment:
      PGHOST: spotify-db
      PGPORT: "5432"
      PGDATABASE: spotify_history
      PGUSER: spotify
      PGPASSWORD: ${SPOTIFY_DB_PASSWORD:?Ejecuta el script de arranque primero}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      spotify-db:
        condition: service_healthy
    networks:
      - spotify_history

volumes:
  spotify_history_data:

networks:
  spotify_history:
    external: true
    name: spotify_history_net
